name: Keep backend awake

# Render's free tier puts the backend to sleep after 15 minutes without traffic,
# and the first request after that takes ~20 seconds. This pings the health
# endpoint so visitors don't hit a cold start.
#
# Limits: GitHub can run scheduled jobs late when it is busy, and it switches
# schedules off after 60 days without a commit to the repository. For a demo,
# also use an external pinger (UptimeRobot / cron-job.org, every 5 minutes).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 2 --retry-delay 5 --max-time 90 \
            -o /dev/null -w "health %{http_code} in %{time_total}s\n" \
            https://medseek-backend.onrender.com/health
